# Docker Compose configuration for local development and testing

name: infection-dating-tool

services:
  infection-dating-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/eduardgrebe/infection-dating-tool:latest
    container_name: infection_dating_tool_app
    ports:
      - "127.0.0.1:8502:8502"
    environment:
      # Streamlit configuration
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
    # volumes:
      # Optional: Mount local code for development (uncomment for hot reload)
      # - ./app.py:/app/app.py:ro
      # - ./core:/app/core:ro
      # - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem (with exceptions for temp files)
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.streamlit

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infection-dating-tool"
version = "2.0.0"
description = "Estimates plausible HIV infection intervals (EP-DDI, LP-DDI, EDDI) from diagnostic test histories"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Eduard Grebe" },
    { name = "Alex Welte" },
    { name = "Shelley Facente" },
]

dependencies = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "scipy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

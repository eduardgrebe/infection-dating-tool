[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infection-dating-tool"
version = "2.1.3"
description = "Estimates plausible HIV infection intervals (EP-DDI, LP-DDI, EDDI) from diagnostic test histories"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.15.2"
authors = [
    { name = "Eduard Grebe" },
    { name = "Alex Welte" },
    { name = "Shelley Facente" },
    { name = "Andrew Powrie" },
    { name = "Gareth Priede" },
]

dependencies = [
    "streamlit>=1.66.1",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "python-dateutil>=4.0.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]
